name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        racket-version: ['stable', 'current']
    steps:
      - uses: actions/checkout@v4
      - name: Check out obsidian dependency (until it is on the catalog)
        uses: actions/checkout@v4
        with:
          repository: turlamai/obsidian
          path: obsidian-pkg
      - uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: ${{ matrix.racket-version }}
      - name: Install obsidian dependency
        run: |
          mv "$GITHUB_WORKSPACE/obsidian-pkg" "$RUNNER_TEMP/obsidian-pkg"
          raco pkg install --auto --name obsidian --link "$RUNNER_TEMP/obsidian-pkg"
      - name: Install postly
        run: raco pkg install --auto --link "$GITHUB_WORKSPACE"
      - name: Setup gate (dependency check)
        run: raco setup --check-pkg-deps postly
      - name: Tests
        run: raco test test
      - name: Build the example site
        run: |
          raco postly --out "$RUNNER_TEMP/postly-leading" build example
          raco postly build example --out "$RUNNER_TEMP/postly-trailing"
          test -s "$RUNNER_TEMP/postly-leading/index.html"
          test -s "$RUNNER_TEMP/postly-trailing/static/style.css"
          diff -r "$RUNNER_TEMP/postly-leading" "$RUNNER_TEMP/postly-trailing"
